[workspace]
channels = ["https://conda.modular.com/max-nightly", "conda-forge", "PyPI", "pytorch"]
name = "mojo_monday"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.6"  

[tasks]
vector_addition = "python max-graph/vector_addition.py"

[dependencies]
mojo = ">=0.25.7.0,<0.26"
python = ">=3.9,<3.14"
max = ">=24.6.0"
imageio = ">=2.37.0,<3"
python-fasthtml = ">=0.12.0,<0.13"
jupyterlab = ">=4.5.0,<5"
modular = ">=25.7.0,<26"
pytorch-gpu = ">=2.7.1,<3"
cxx-compiler = "*"
openai = ">=2.14.0,<3"
