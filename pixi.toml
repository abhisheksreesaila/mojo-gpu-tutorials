[workspace]
channels = ["https://conda.modular.com/max-nightly", "conda-forge", "PyPI", "pytorch"]
name = "mojo_monday"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.6"  

[dependencies]
imageio = ">=2.37.0,<3"
python-fasthtml = ">=0.12.0,<0.13"
jupyterlab = ">=4.5.0,<5"     
pytorch-gpu = ">=2.7.1,<3"
cxx-compiler = "*"
openai = ">=2.14.0,<3"
nbformat = ">=5.10.4,<6"
modular = "==26.4.0"
python = "3.12.*"           # ← important, see note below
pyarrow = ">=19.0"
ipykernel = ">=7.0.0,<8"

[pypi-dependencies]
mxframe = "==0.5.0"
sqlglot = ">=25.0"